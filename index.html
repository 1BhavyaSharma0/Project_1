<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kundali – The Path of Life</title>
<meta name="description" content="Kundali – The Path of Life. Free Vedic birth chart with Navamsa, Panchang, Manglik and Kaal Sarp checks and readings, for any birthplace in the world, in English and Hindi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060414; --ink:#f4eeff; --muted:#b9acdb; --gold:#f2c66d; --gold-deep:#b8832c;
  --violet:#8b5cf6; --card:rgba(18,10,42,.70); --line:rgba(242,198,109,.30); --err:#ff9a9a; --ok:#9fe3b5;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(4rem + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;min-height:100%}
body[data-scene="cast"]{overflow:hidden}
html[lang="hi"] body{font-family:'Noto Sans Devanagari','Inter',system-ui,sans-serif;line-height:1.7}
html[lang="hi"] .title,html[lang="hi"] .sub,html[lang="hi"] .brandbtn,html[lang="hi"] .rhead h2,html[lang="hi"] h3,html[lang="hi"] .step h2,html[lang="hi"] #cast-title,html[lang="hi"] .rhead .brand{font-family:'Tiro Devanagari Hindi','Noto Sans Devanagari',Georgia,serif;letter-spacing:0;font-style:normal}
#cosmos{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1}
button{font-family:inherit}

/* ---------- Top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:calc(.7rem + env(safe-area-inset-top,0px)) clamp(.9rem,3vw,2rem) .7rem;pointer-events:none}
.topbar>*{pointer-events:auto}
.brandbtn{background:none;border:0;cursor:pointer;font:700 1.05rem 'Cinzel',Georgia,serif;letter-spacing:.12em;color:var(--gold);padding:.3rem .35rem;border-radius:8px;text-shadow:0 0 18px rgba(242,198,109,.45)}
.tbr{display:flex;align-items:center;gap:.6rem}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(8,4,24,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .82rem 'Inter','Noto Sans Devanagari',sans-serif;padding:.32rem .75rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#2a1700}
.nbtn{display:none;align-items:center;font:600 .85rem 'Inter','Noto Sans Devanagari',sans-serif;color:var(--gold);background:rgba(8,4,24,.62);border:1px solid var(--gold);border-radius:999px;padding:.4rem .9rem;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body[data-scene="result"] .nbtn{display:inline-flex}
.nbtn:hover{background:rgba(242,198,109,.14)}

/* ---------- Landing ---------- */
#landing{min-height:100svh;display:grid;align-items:center;gap:2rem;padding:5.2rem clamp(1.1rem,4vw,3rem) 2.5rem;max-width:1180px;margin:0 auto;transition:opacity .9s ease,transform .9s ease}
@media(min-width:900px){#landing{grid-template-columns:1.05fr .95fr;gap:4rem}}
body[data-scene="cast"] #landing,body[data-scene="result"] #landing{opacity:0;transform:scale(.97);pointer-events:none}
.title{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:clamp(3.4rem,12vw,7.4rem);letter-spacing:.06em;line-height:1.05;margin:0;
  background:linear-gradient(180deg,#fff4cf 0%,#f2c66d 55%,#b8832c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(242,198,109,.38))}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.7rem,4.6vw,2.7rem);color:#eadfff;margin:.25em 0 0;letter-spacing:.05em}
.lead{max-width:28rem;color:var(--muted);font-size:1.05rem;margin:1.4rem 0 0}
.hero{text-align:center}
.hero .lead{margin-left:auto;margin-right:auto}
@media(min-width:900px){.hero{text-align:left}.hero .lead{margin-left:0}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(1.1rem,3vw,1.7rem);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.85rem}
input,select{display:block;width:100%;margin-top:.3rem;padding:.75rem .85rem;font:inherit;font-size:1rem;color:var(--ink);background:rgba(8,4,24,.72);border:1px solid rgba(185,172,219,.28);border-radius:12px;color-scheme:dark;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#7f72a6}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,198,109,.18);outline:none}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.hint{font-size:.82rem;color:var(--muted);margin:.1rem 0 .8rem}
.hint.ok{color:var(--ok)}
.err{color:var(--err);font-size:.9rem;min-height:1.3em;margin:.7rem 0 0}

/* stepper */
.stepper{list-style:none;display:flex;align-items:center;gap:.5rem;margin:0 0 1.3rem;padding:0}
.st{display:flex;align-items:center;gap:.45rem;color:var(--muted);font-size:.8rem;white-space:nowrap}
.st b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:600;font-size:.8rem;transition:all .3s}
.st.act{color:var(--ink)}
.st.act b{background:var(--gold);color:#2a1700;border-color:var(--gold);box-shadow:0 0 16px rgba(242,198,109,.5)}
.st.done b{background:rgba(242,198,109,.2);color:var(--gold)}
.bar{flex:1;height:1px;background:var(--line);min-width:12px}
.step{display:none}
.step.on{display:block;animation:stepin .45s ease}
@keyframes stepin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.step h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.8rem;line-height:1.2;margin:0 0 1rem;color:var(--gold)}
.chk{display:flex;align-items:center;gap:.6rem;color:var(--ink);font-size:.92rem;margin:.1rem 0 .4rem;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--gold)}
.nav{display:flex;gap:.7rem;margin-top:.6rem}
.back{flex:0 0 auto;padding:.95rem 1.2rem;font:600 1rem 'Inter','Noto Sans Devanagari',sans-serif;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.back:hover{color:var(--ink);border-color:var(--gold)}
.cta{flex:1;padding:.95rem 1rem;font:600 1.05rem 'Inter','Noto Sans Devanagari',sans-serif;color:#2a1700;background:linear-gradient(180deg,#ffe19a,#f2c66d 55%,#d9a54a);border:0;border-radius:12px;cursor:pointer;box-shadow:0 8px 28px rgba(242,198,109,.28);transition:transform .15s ease,box-shadow .15s ease}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(242,198,109,.4)}
.cta:active{transform:translateY(0)}

/* place search */
.combo{position:relative}
.list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:290px;overflow:auto;background:rgba(14,8,34,.98);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px rgba(0,0,0,.55);padding:.3rem;margin:0;list-style:none}
.list li{padding:.6rem .75rem;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;line-height:1.35}
.list li[aria-selected="true"],.list li:hover{background:rgba(242,198,109,.15)}
.list .nm{font-weight:600;color:var(--ink)}
.list .sc{font-size:.8rem;color:var(--muted)}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em;margin:.4rem 0 .6rem}
.chosen{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .85rem;border:1px solid var(--line);border-radius:12px;background:rgba(242,198,109,.07);margin:.2rem 0 .8rem;font-size:.92rem}
.chosen .tick{color:var(--ok);font-weight:700}
.chosen small{display:block;color:var(--muted);font-size:.8rem}
.ghost{width:100%;margin:0 0 .8rem;padding:.6rem .8rem;font:500 .92rem 'Inter','Noto Sans Devanagari',sans-serif;color:var(--gold);background:rgba(242,198,109,.08);border:1px dashed var(--line);border-radius:10px;cursor:pointer}
.ghost:hover{background:rgba(242,198,109,.15)}
.ghost:disabled{opacity:.6;cursor:progress}
details.adv{border:1px solid rgba(185,172,219,.2);border-radius:12px;padding:.1rem .85rem;margin:.2rem 0 .4rem}
details.adv summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:.6rem 0;list-style:none}
details.adv summary::before{content:'\25B8';display:inline-block;margin-right:.5rem;transition:transform .2s}
details.adv[open] summary::before{transform:rotate(90deg)}
details.adv .row{padding-bottom:.2rem}

/* recent */
.recent{margin-top:1rem;padding:0 .2rem}
.rt{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin:0 0 .5rem}
.lnk{background:none;border:0;color:var(--gold);cursor:pointer;font-size:.82rem;text-decoration:underline;padding:0}
#recent-list{display:flex;flex-wrap:wrap;gap:.5rem}
.rc{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:rgba(8,4,24,.6);overflow:hidden}
.rcb{background:none;border:0;color:var(--ink);padding:.4rem .5rem .4rem .85rem;font-size:.85rem;cursor:pointer}
.rcx{background:none;border:0;color:var(--muted);padding:.4rem .75rem .4rem .35rem;font-size:1rem;line-height:1;cursor:pointer}
.rcb:hover,.rcx:hover{color:var(--gold)}

/* ---------- Casting overlay ---------- */
#cast{position:fixed;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));text-align:center;padding:0 1.2rem;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:2}
body[data-scene="cast"] #cast{opacity:1}
#cast-title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.5rem,4.5vw,2.3rem);color:#f6e6bd;margin:0;text-shadow:0 0 24px rgba(242,198,109,.45);transition:opacity .4s ease}
#cast-sub{margin:.3rem 0 0;color:var(--muted);font-size:.95rem}

/* ---------- Result ---------- */
#result{display:none;padding:5rem clamp(1.1rem,4vw,3rem) 2rem;max-width:1100px;margin:0 auto}
.rhead{text-align:center;margin:.4rem 0 1.8rem}
.rhead .brand{font-family:'Cinzel',Georgia,serif;color:var(--gold);letter-spacing:.1em;font-size:1rem;margin:0}
.rhead h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.1;margin:.2rem 0 .4rem}
.rhead p.meta{color:var(--muted);margin:.15rem 0;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:1.1rem}
.chip{display:inline-flex;align-items:center;gap:.55rem;padding:.45rem 1rem .45rem .6rem;border:1px solid var(--line);border-radius:999px;background:rgba(18,10,42,.6);font-size:.95rem}
.chip .gl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(242,198,109,.15);color:var(--gold);font-size:1.15rem;line-height:1}
.chip small{display:block;color:var(--muted);font-size:.72rem;line-height:1.1}
.chip b{font-weight:600;line-height:1.15}
.rgrid{display:grid;gap:1.4rem;margin-bottom:1.4rem}
@media(min-width:900px){.rgrid{grid-template-columns:1.1fr .9fr;align-items:start}}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-bottom:1rem}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(8,4,24,.55)}
.tab{border:0;background:transparent;color:var(--muted);font:500 .88rem 'Inter','Noto Sans Devanagari',system-ui,sans-serif;padding:.45rem .95rem;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--gold);color:#2a1700}
.sw{display:inline-flex;align-items:center;gap:.6rem;background:transparent;border:0;color:var(--muted);font:500 .9rem 'Inter','Noto Sans Devanagari',sans-serif;cursor:pointer;padding:.25rem 0}
.sw .knob{position:relative;width:42px;height:24px;border-radius:999px;background:rgba(185,172,219,.25);border:1px solid var(--line);transition:background .2s}
.sw .knob::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#e9ddff;transition:transform .2s,background .2s}
.sw[aria-checked="true"] .knob{background:var(--gold)}
.sw[aria-checked="true"] .knob::after{transform:translateX(18px);background:#2a1700}
.sw:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.d9note{font-size:.85rem;color:var(--muted);margin:0 0 1rem;padding:.6rem .8rem;border-left:2px solid var(--gold);background:rgba(242,198,109,.06);border-radius:0 8px 8px 0}
#chart{max-width:520px;margin:0 auto}
#chart svg{width:100%;height:auto;display:block}
.hl{fill:rgba(139,92,246,.09);stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.hl.asc-cell{fill:rgba(242,198,109,.10)}
.pl{fill:var(--ink);font:600 15px 'Inter','Noto Sans Devanagari',system-ui,sans-serif}
.pl .asc{fill:var(--gold)}
.sg{fill:#9d8fd0;font:500 12px 'Inter','Noto Sans Devanagari',system-ui,sans-serif}
.ctr{fill:var(--gold);font:600 20px 'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif}
.ctr2{fill:var(--muted);font:500 12px 'Inter','Noto Sans Devanagari',system-ui,sans-serif}
.hg{opacity:0;animation:hin .9s ease forwards}
@keyframes hin{from{opacity:0}to{opacity:1}}
.still .hg{animation:none;opacity:1}
.pk{cursor:pointer;outline:none}
.pk .selring{fill:none;stroke:var(--gold);stroke-width:1.6;opacity:0;transition:opacity .2s}
.pk:hover .selring,.pk:focus-visible .selring{opacity:.55}
.pk.sel .selring{opacity:1}
tspan.pk:hover,tspan.pk.sel{fill:var(--gold)}
tspan.pk.sel{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5rem 1.1rem;font-size:.82rem;color:var(--muted);margin:1rem 0 0}
.lg{display:inline-flex;align-items:center;gap:.3rem}
.pdetail{margin-top:1.1rem;padding-top:1rem;border-top:1px solid rgba(185,172,219,.16);min-height:3.2rem}
.pdh{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
.pd{display:flex;gap:1rem;align-items:flex-start;animation:hin .35s ease}
.pdi{flex:0 0 64px;height:64px;line-height:0}
.pd h4{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;font-size:1.4rem;font-weight:600;color:var(--gold);margin:0}
.pd p{margin:.2rem 0 0;font-size:.92rem}
.pd .pds{color:var(--muted);font-size:.85rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tag{font-size:.74rem;padding:.12rem .55rem;border-radius:999px;border:1px solid var(--line);color:var(--gold);background:rgba(242,198,109,.08)}
.actions{display:flex;justify-content:center;margin-top:1rem}
.btn2{padding:.6rem 1.2rem;font:600 .92rem 'Inter','Noto Sans Devanagari',sans-serif;color:var(--gold);background:transparent;border:1px solid var(--gold);border-radius:999px;cursor:pointer}
.btn2:hover{background:rgba(242,198,109,.12)}
.btn2:disabled{opacity:.6;cursor:progress}
.side{display:grid;gap:.9rem}
.mini h3{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;font-weight:600;font-size:1.35rem;color:var(--gold);margin:0}
.mini .big{font-size:1.15rem;font-weight:600;margin:.1rem 0 .3rem}
.mini p{margin:0;color:var(--muted);font-size:.95rem}
.section{margin-bottom:1.4rem}
.section h3{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;font-weight:600;font-size:1.5rem;color:var(--gold);margin:0 0 .8rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid rgba(185,172,219,.16);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.85rem}
tr.now td{background:rgba(242,198,109,.12);color:#fff0c8}
.ti{display:inline-block;vertical-align:middle;width:24px;margin-right:.5rem;line-height:0}
.note{font-size:.85rem;color:var(--muted);margin:.8rem 0 0}
.again{display:block;margin:1.8rem auto 1rem;padding:.8rem 1.6rem;font:600 1rem 'Inter','Noto Sans Devanagari',sans-serif;color:var(--gold);background:transparent;border:1px solid var(--gold);border-radius:999px;cursor:pointer}
.again:hover{background:rgba(242,198,109,.12)}
.rv{opacity:0;animation:hin 1s ease forwards}

/* ---------- planet animation (SVG sprites) ---------- */
.scr{animation:scrx linear infinite}
@keyframes scrx{from{transform:translateX(0)}to{transform:translateX(var(--w))}}
.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.12);opacity:1}}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 22s linear infinite reverse;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
.rb{fill:var(--gold);font:700 8px 'Inter',system-ui,sans-serif}
@media(prefers-reduced-motion:reduce){.hg,.rv,.step.on,.pd{animation:none;opacity:1}.cta{transition:none}.scr,.pulse,.spin,.spinr,.bob{animation:none}}

/* ---------- v3 additions ---------- */
.tag1{font:600 clamp(1.05rem,2.4vw,1.35rem) 'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;color:#f6e6bd;margin:1.3rem 0 0;letter-spacing:.02em}
html[lang="hi"] .tag1{font-family:'Tiro Devanagari Hindi','Noto Sans Devanagari',serif}
.herocta{margin-top:1.4rem;padding:.9rem 1.8rem;font:600 1.02rem 'Inter','Noto Sans Devanagari',sans-serif;color:#2a1700;background:linear-gradient(180deg,#ffe19a,#f2c66d 55%,#d9a54a);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 28px rgba(242,198,109,.3);transition:transform .15s,box-shadow .15s}
.herocta:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(242,198,109,.45)}
.feats{list-style:none;margin:1.8rem 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1.2rem;max-width:30rem}
.hero .feats{margin-left:auto;margin-right:auto}
@media(min-width:900px){.hero .feats{margin-left:0}}
.feats li{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.88rem;text-align:left}
.fi{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);background:rgba(242,198,109,.08);font-size:1rem}
.fh{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;font-weight:600;font-size:1.8rem;line-height:1.2;margin:0 0 1rem;color:var(--gold)}
.cta.full{display:block;width:100%;margin-top:.4rem}
.pops{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .7rem}
.pops button{background:rgba(8,4,24,.6);border:1px solid rgba(185,172,219,.25);color:var(--muted);border-radius:999px;padding:.28rem .75rem;font-size:.8rem;cursor:pointer}
.pops button:hover{color:var(--gold);border-color:var(--gold)}

/* progress in the loading scene */
.prog{list-style:none;display:flex;justify-content:center;gap:clamp(.8rem,4vw,2.6rem);margin:1.4rem auto 0;padding:0;max-width:720px}
.prog li{display:flex;flex-direction:column;align-items:center;gap:.45rem;font-size:.78rem;color:#7f72a6;position:relative;flex:1;transition:color .4s}
.prog li i{width:14px;height:14px;border-radius:50%;border:2px solid #5d5088;background:transparent;display:block;transition:all .4s;position:relative;z-index:1}
.prog li::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:#3d3366;z-index:0;transition:background .4s}
.prog li:first-child::before{display:none}
.prog li.done{color:var(--muted)}
.prog li.done i,.prog li.cur i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 12px rgba(242,198,109,.7)}
.prog li.done::before,.prog li.cur::before{background:var(--gold)}
.prog li.cur{color:var(--ink)}

/* dashboard */

.snav button:hover{color:var(--ink)}

.si{font-size:1rem;line-height:1}
@media(min-width:1000px){

}
.pane{display:none}
.pane.on{display:block;animation:hin .45s ease}
.dim{opacity:.75}

/* highlights, readings */
.hl3{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.hk{border:1px solid rgba(185,172,219,.2);border-radius:12px;padding:.6rem .8rem;background:rgba(8,4,24,.45)}
.hk small{display:block;color:var(--muted);font-size:.75rem}
.hk b{font-weight:600;font-size:1rem}
.traits{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.trait{font-size:.78rem;padding:.2rem .65rem;border:1px solid var(--line);border-radius:999px;color:var(--gold);background:rgba(242,198,109,.07);text-transform:capitalize}
.acc details{border:1px solid rgba(185,172,219,.2);border-radius:14px;margin-bottom:.6rem;background:rgba(8,4,24,.4);overflow:hidden}
.acc summary{display:flex;align-items:center;gap:.7rem;cursor:pointer;padding:.7rem .9rem;list-style:none;font-weight:500}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'+';margin-left:auto;color:var(--gold);font-size:1.2rem;line-height:1}
.acc details[open] summary::after{content:'\2212'}
.acc summary small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.acc .body{padding:0 1rem 1rem}
.acc .body p{margin:.5rem 0 0;color:#e2d8f7;font-size:.95rem}
.acc .body .btn2{margin-top:.8rem}
.hno{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);font-weight:600;background:rgba(242,198,109,.08)}
.sicon{width:34px;height:34px;flex:0 0 34px;line-height:0}

/* table rows clickable */
tr.clk{cursor:pointer}
tr.clk:hover td{background:rgba(242,198,109,.08)}
.deg{font-variant-numeric:tabular-nums;color:#fff0c8;font-weight:600}

/* panchang */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.pc{border:1px solid rgba(185,172,219,.2);border-radius:14px;padding:.8rem .95rem;background:rgba(8,4,24,.45)}
.pc small{display:block;color:var(--muted);font-size:.78rem}
.pc b{display:block;font-size:1.15rem;font-weight:600;margin:.1rem 0 .2rem;font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;color:var(--gold);font-size:1.4rem}
.pc p{margin:0;color:var(--muted);font-size:.85rem}
.bar2{height:5px;border-radius:99px;background:rgba(185,172,219,.18);margin-top:.5rem;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#f2c66d,#ffe19a)}

/* doshas */
.dgrid{display:grid;gap:1.2rem}

.dc h3{margin-bottom:.4rem}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:.2rem .75rem;border-radius:999px;margin:.1rem 0 .7rem}
.pill.good{background:rgba(159,227,181,.14);color:var(--ok);border:1px solid rgba(159,227,181,.4)}
.pill.warn{background:rgba(242,198,109,.14);color:var(--gold);border:1px solid var(--line)}
.pill.high{background:rgba(255,154,154,.12);color:var(--err);border:1px solid rgba(255,154,154,.4)}
.dc ul{margin:.3rem 0 .8rem;padding-left:1.1rem;color:#e2d8f7;font-size:.93rem}
.dc p{margin:.4rem 0;color:#e2d8f7;font-size:.95rem}
.dc .sm{color:var(--muted);font-size:.85rem}

/* dasha timeline */
.tl{display:grid;gap:.6rem}
.tr{display:grid;grid-template-columns:34px 1fr auto;gap:.8rem;align-items:center;padding:.7rem .85rem;border:1px solid rgba(185,172,219,.2);border-radius:14px;background:rgba(8,4,24,.4)}
.tr.cur{border-color:var(--gold);background:rgba(242,198,109,.1);box-shadow:0 0 24px rgba(242,198,109,.12)}
.tr.past{opacity:.7}
.tr b{font-weight:600}
.tr small{display:block;color:var(--muted);font-size:.8rem}
.st2{font-size:.76rem;padding:.15rem .6rem;border-radius:99px;border:1px solid rgba(185,172,219,.3);color:var(--muted);white-space:nowrap}
.tr.cur .st2{color:var(--gold);border-color:var(--gold)}
.tr .bar2{grid-column:2 / -1;margin-top:.1rem}

/* chart degree labels */
.dg{fill:#cdbfee;font:500 7.5px 'Inter',system-ui,sans-serif}
.pl .dd{font-size:10px;fill:#cdbfee;font-weight:500}

/* planet modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(3,1,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mcard{position:relative;width:min(520px,100%);max-height:calc(100svh - 2rem);overflow:auto;background:rgba(16,9,38,.97);border:1px solid var(--line);border-radius:22px;padding:1.4rem;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.mx{position:absolute;top:.7rem;right:.8rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(8,4,24,.7);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
.mx:hover{color:var(--gold);border-color:var(--gold)}
.mhead{display:flex;gap:1.1rem;align-items:center;margin-bottom:1rem;padding-right:2.4rem}
.mpl{flex:0 0 112px;height:112px;line-height:0}
.mhead h3{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;font-weight:600;font-size:1.9rem;color:var(--gold);margin:0 0 .3rem}
.mdl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.2rem;margin:0 0 1rem;font-size:.93rem}

.mread{margin:0;color:#e2d8f7;font-size:.95rem;line-height:1.7;border-top:1px solid rgba(185,172,219,.18);padding-top:.9rem}

function planetTrop(k,d){

function computeChart(inp){
  const utMs=Date.UTC(inp.y,inp.mo-1,inp.d,inp.hh,inp.mm)-inp.tz*3600000;
  const jd=utMs/86400000+2440587.5, d=jd-2451543.5, T=(jd-2451545)/36525;
  const ayan=23.8531+0.013969*((jd-2451545)/365.25);
  const sun=sunPos(d), trop={};
  trop.Sun=sun.lon; trop.Moon=moonLon(d,sun);
  ['Mercury','Venus','Mars','Jupiter','Saturn'].forEach(k=>trop[k]=planetTrop(k,d));
  trop.Rahu=n360(125.1228-0.0529538083*d); trop.Ketu=n360(trop.Rahu+180);
  const retro=k=>{
    if(k==='Rahu'||k==='Ketu')return true;
    if(k==='Sun'||k==='Moon')return false;
    return (((planetTrop(k,d+0.5)-planetTrop(k,d-0.5)+540)%360)-180)<0;
  };
  /* ascendant */
  const gmst=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T;
  const th=rad(n360(gmst+inp.lon)), eps=rad(23.4392911-0.0130042*T), phi=rad(inp.lat);
  const ascTrop=n360(deg(Math.atan2(Math.cos(th),-(Math.sin(th)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))));
  const asc=n360(ascTrop-ayan), ascSign=Math.floor(asc/30);
  const planets=P.map(p=>{
    const lon=n360(trop[p.k]-ayan), sign=Math.floor(lon/30), nIdx=Math.floor(lon/(360/27));
    return {k:p.k,s:p.s,ab:p.ab,lon:lon,sign:sign,deg:lon%30,nak:NAKS[nIdx],nIdx:nIdx,pada:Math.floor((lon%(360/27))/(360/108))+1,
            house:((sign-ascSign+12)%12)+1,retro:retro(p.k)};
  });
  return {inp:inp,ayan:ayan,asc:asc,ascSign:ascSign,ascDeg:asc%30,planets:planets,utMs:utMs};
}
function dasha(moonLonSid,birthMs){
  const span=360/27, idx=Math.floor(moonLonSid/span), frac=(moonLonSid%span)/span, YR=365.2425*86400000;
  let li=idx%9, start=birthMs, out=[], end=start+DY[li]*(1-frac)*YR;
  out.push({lord:DL[li],start:start,end:end,first:true}); start=end;
  for(let n=1;n<9;n++){li=(li+1)%9; end=start+DY[li]*YR; out.push({lord:DL[li],start:start,end:end}); start=end;}
  return out;
}

function parseCities(txt){
  const out=[]; let cc='',tz='';
  txt.split('\n').forEach(l=>{
    l=l.trim(); if(!l)return;
    if(l[0]==='@'){const p=l.slice(1).split('|');cc=p[0];tz=p[1]||'';return;}
    const p=l.split(','); out.push([p[0],cc,+p[1],+p[2],p[3]||tz]);
  });
  return out;
}

function mkDtf(z){return new Intl.DateTimeFormat('en-US',{timeZone:z,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});}
function dtf(z){
  if(dtfs[z]===undefined){
    try{dtfs[z]=mkDtf(z);}catch(e){try{dtfs[z]=ZALIAS[z]?mkDtf(ZALIAS[z]):null;}catch(e2){dtfs[z]=null;}}
  }

function zoneOffset(z,utcMs){
  const f=dtf(z); if(!f)return null;
  const tt=Math.floor(utcMs/1000)*1000, p={};
  f.formatToParts(new Date(tt)).forEach(x=>{if(x.type!=='literal')p[x.type]=+x.value;});
  return (Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second)-tt)/3600000;
}
function resolveOffset(z,y,mo,d,hh,mm){
  const local=Date.UTC(y,mo-1,d,hh,mm), o1=zoneOffset(z,local);
  if(o1===null)return null;

function applyLang(){
  document.documentElement.lang=LANG; document.title=t('doc_title');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.getAttribute('data-i'));});
  document.querySelectorAll('[data-ip]').forEach(el=>{el.setAttribute('placeholder',t(el.getAttribute('data-ip')));});
  document.querySelectorAll('.lang button').forEach(b=>{b.setAttribute('aria-pressed',String(b.getAttribute('data-l')===LANG));});
  $('btn-next').textContent=t('reveal'); setTimeHint(); refreshTz(); renderChosen(); renderRecent(); setStatus(statusKey); updateAsk();
  if(typeof castIdx!=='undefined')castIdx=-1;
  if(S.phase==='result'&&chart){renderResult();if(!$('pmodal').hidden&&selK)openPlanet(selK,true);}
}

function sunriseMs(ch){
  const i=ch.inp, noon0=Date.UTC(i.y,i.mo-1,i.d,12,0)-(i.lon/15)*3600000;
  const jd=noon0/86400000+2440587.5, d=jd-2451543.5, sun=sunPos(d), eps=rad(23.4393-3.563e-7*d);
  const L=n360(sun.w+sun.M), ra=n360(deg(Math.atan2(Math.cos(eps)*Math.sin(rad(sun.lon)),Math.cos(rad(sun.lon)))));
  const eot=((L-ra+540)%360)-180, dec=Math.asin(Math.sin(eps)*Math.sin(rad(sun.lon))), phi=rad(i.lat);
  const c=(Math.sin(rad(-0.833))-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
  if(!(Math.abs(c)<=1))return Date.UTC(i.y,i.mo-1,i.d,6,0)-i.tz*3600000;
  return noon0-eot*4*60000-(deg(Math.acos(c))/15)*3600000;
}
function panchang(ch){
  const sun=ch.planets[0].lon, moon=ch.planets[1].lon, el=n360(moon-sun), ti=Math.floor(el/12);
  const sr=sunriseMs(ch), i=ch.inp;
  let wd=new Date(Date.UTC(i.y,i.mo-1,i.d)).getUTCDay(); if(ch.utMs<sr)wd=(wd+6)%7;
  const kn=Math.floor(el/6);
  return {el:el,tithi:ti,paksha:ti<15?0:1,tn:ti%15,tfrac:(el%12)/12,yoga:Math.floor(n360(sun+moon)/(360/27)),kn:kn,vara:wd,sunrise:sr};
}
function karanaName(kn){
  if(kn===0)return {n:KIMS[LANG],fixed:true};
  if(kn>=57)return {n:KAR_FIX[LANG][kn-57],fixed:true};
  return {n:KAR_MOV[LANG][(kn-1)%7],fixed:false};
}
function tithiName(pc){
  if(pc.tn===14)return t(pc.paksha===0?'purnima':'amavasya');
  return TITHI[LANG][pc.tn];
}

/* ================= MANGLIK AND KAAL SARP ================= */
function manglik(ch){
  const M=ch.planets[2], moon=ch.planets[1], ven=ch.planets[5], jup=ch.planets[4];
  const BAD=[1,2,4,7,8,12], rel=(a,b)=>((a-b+12)%12)+1;
  const refs=[{k:'m_from_lagna',h:M.house},{k:'m_from_moon',h:rel(M.sign,moon.sign)},{k:'m_from_venus',h:rel(M.sign,ven.sign)}];
  refs.forEach(r=>{r.bad=BAD.indexOf(r.h)>=0;});
  const n=refs.filter(r=>r.bad).length;
  let level='none'; if(refs[0].bad)level=n>=2?'strong':'yes'; else if(n>=1)level='partial';
  const mit=[]; if([0,7,9].indexOf(M.sign)>=0)mit.push('m_mit_own'); if([1,5,7,9].indexOf(rel(M.sign,jup.sign))>=0)mit.push('m_mit_jup');
  return {refs:refs,level:level,mit:mit};
}
const KS_NAMES={en:['Anant','Kulik','Vasuki','Shankhpal','Padma','Mahapadma','Takshak','Karkotak','Shankhchud','Ghatak','Vishdhar','Sheshnag'],
                hi:['अनंत','कुलिक','वासुकि','शंखपाल','पद्म','महापद्म','तक्षक','कर्कोटक','शंखचूड़','घातक','विषधर','शेषनाग']};
function kaalsarp(ch){
  const R=ch.planets[7].lon, seven=ch.planets.slice(0,7);
  const side=seven.map(p=>{const x=n360(p.lon-R);return x>0&&x<180?1:0;}), ahead=side.reduce((a,b)=>a+b,0);
  let type='none', odd=null;
  if(ahead===7)type='full'; else if(ahead===0)type='rev';
  else if(ahead===6){type='part';odd=seven[side.indexOf(0)];}
  else if(ahead===1){type='part';odd=seven[side.indexOf(1)];}
  return {type:type,odd:odd,rahuHouse:ch.planets[7].house,ketuHouse:ch.planets[8].house};
}

  const kkey={none:'ks_none',full:'ks_full',rev:'ks_rev',part:'ks_part'}[k.type], kpill=k.type==='none'?'good':(k.type==='full'?'high':'warn');
  let ktxt=k.type==='part'?t('ks_txt_part',{p:plName(k.odd.k)}):t({none:'ks_txt_none',full:'ks_txt_full',rev:'ks_txt_rev'}[k.type]);

function planetReading(p){
  const o=ORD[LANG], hm=HMEAN[LANG].map(x=>LANG==='en'?x.toLowerCase():x), d9=viewOf(chart,'D9').planets.find(x=>x.k===p.k);
  const lord=SIGN_LORD[p.sign], lp=chart.planets.find(x=>x.k===lord);
  const out=[t('pr_1',{P:plName(p.k),S:signName(p.sign),O:o[p.house-1],H:hm[p.house-1]}),PLONG[LANG][p.k],
    t('pr_3',{S:signShort(p.sign),F:FLAVOR[LANG][p.sign]}),t('pr_4',{O:o[p.house-1],H:hm[p.house-1]})];
  out.push(lord===p.k?t('pr_5b',{P:plName(p.k)}):t('pr_5',{L:plName(lord),LO:o[lp.house-1],LH:hm[lp.house-1],P:plName(p.k)}));
  const dn=dignity(p.k,p.sign); if(dn)out.push(t('pr_'+dn));
  if(p.retro&&p.k!=='Rahu'&&p.k!=='Ketu')out.push(t('pr_retro'));

function houseReading(n){

let showNames=false, showDeg=true, chart=null, chartStyle='north', chartMode='D1', selK=null;
function viewOf(ch,mode){
  if(mode==='D1')return {asc:ch.ascSign,mode:mode,planets:ch.planets.map(p=>({k:p.k,sign:p.sign,house:p.house,deg:p.deg,retro:p.retro}))};
  const ns=l=>Math.floor(l*9/30)%12, a=ns(ch.asc);
  return {asc:a,mode:mode,planets:ch.planets.map(p=>{const s=ns(p.lon);return {k:p.k,sign:s,house:((s-a+12)%12)+1,deg:(p.lon%(30/9))*9,retro:p.retro};})};
}
function items(v,fn){
  return v.planets.filter(fn).map(p=>({k:p.k,r:p.retro,deg:p.deg,
    tip:plFull(p.k)+' \u00B7 '+signShort(p.sign)+' '+dms(p.deg)+' \u00B7 '+t('house')+' '+p.house+(p.retro?' \u00B7 '+t('retro'):'')}));
}
function block(list,cx,cy,per){
  if(!list.length)return '';
  const lines=[]; for(let i=0;i<list.length;i+=per)lines.push(list.slice(i,i+per));
  const lh=showDeg?17:16, y0=cy-(lines.length-1)*lh/2;
  return lines.map((ln,li)=>'<text class="pl" x="'+cx+'" y="'+f2(y0+li*lh)+'" text-anchor="middle" dominant-baseline="central">'+
    ln.map((it,ti)=>{
      if(it.asc)return '<tspan class="asc"'+(ti?' dx="7"':'')+'>'+esc(t('asc_ab'))+'</tspan>';
      return '<tspan class="pk" data-k="'+it.k+'"'+(ti?' dx="7"':'')+'>'+esc(plAb(it.k))+(it.r?'\u02B3':'')+'</tspan>'+(showDeg?'<tspan class="dd" dx="2">'+Math.floor(it.deg)+'\u00B0</tspan>':'');
    }).join('')+'</text>').join('');
}
function spriteBlock(list,cx,cy){
  const n=list.length; if(!n)return '';
  const r=n===1?13:(n<=3?11.5:(n<=6?9.5:8)), per=n<=3?n:(n===4?2:3), rows=[];
  for(let i=0;i<n;i+=per)rows.push(list.slice(i,i+per));
  const hs=2.5*r+5, vs=2.3*r+4+(showDeg?9:0), y0=cy-(rows.length-1)*vs/2; let s='';
  rows.forEach((row,ri)=>{
    const x0=cx-(row.length-1)*hs/2;
    row.forEach((it,ci)=>{
      const x=x0+ci*hs, y=y0+ri*vs;
      s+='<g transform="translate('+f2(x)+' '+f2(y)+')"><g class="pk" data-k="'+it.k+'" role="button" tabindex="0" aria-label="'+esc(it.tip)+'">'+
         '<g class="bob" style="animation-delay:-'+((ri*3+ci)*.9).toFixed(1)+'s"><title>'+esc(it.tip)+'</title>'+sprite(it.k,r)+'</g>'+
         '<circle class="selring" r="'+f2(r*1.6)+'"/>'+(it.r?'<text class="rb" x="'+f2(r*.7)+'" y="'+f2(r*1.2)+'">R</text>':'')+
         (showDeg?'<text class="dg" x="0" y="'+f2(r+9.5)+'" text-anchor="middle">'+Math.floor(it.deg)+'\u00B0</text>':'')+'</g></g>';
    });
  });
  return s;
}
const ASCTXT=(x,y,anchor)=>'<text class="pl" x="'+x+'" y="'+y+'" text-anchor="'+anchor+'"><tspan class="asc">'+esc(t('asc_ab'))+'</tspan></text>';

function northSVG(v,still){
  let s='<svg viewBox="-4 -4 408 408"'+(still?' class="still"':'')+' role="img" aria-label="'+esc(t(v.mode==='D1'?'centre1':'centre9'))+'">';
  NORTH.forEach((h,i)=>{
    const sign=(v.asc+i)%12, list=items(v,p=>p.house===i+1); let inner;
    if(showNames){if(i===0)list.unshift({asc:true}); inner=block(list,h.pl[0],h.pl[1],showDeg?h.w:3);}
    else inner=spriteBlock(list,h.pl[0],h.pl[1])+(i===0?ASCTXT(200,22,'middle'):'');
    s+='<g class="hg" style="animation-delay:'+(i*0.09).toFixed(2)+'s"><polygon class="hl'+(i===0?' asc-cell':'')+'" points="'+h.p+'"/>'+
       '<text class="sg" x="'+h.sg[0]+'" y="'+h.sg[1]+'" text-anchor="middle" dominant-baseline="central">'+(sign+1)+'</text>'+inner+'</g>';
  });
  return s+'</svg>';
}
const SOUTH=[[1,0],[2,0],[3,0],[3,1],[3,2],[3,3],[2,3],[1,3],[0,3],[0,2],[0,1],[0,0]];
function southSVG(v,still){
  let s='<svg viewBox="-4 -4 408 408"'+(still?' class="still"':'')+' role="img" aria-label="'+esc(t(v.mode==='D1'?'centre1':'centre9'))+'">';
  for(let i=0;i<12;i++){
    const x=SOUTH[i][0]*100, y=SOUTH[i][1]*100, list=items(v,p=>p.sign===i), isAsc=v.asc===i; let inner;
    if(showNames){if(isAsc)list.unshift({asc:true}); inner=block(list,x+50,y+58,showDeg?2:3);}
    else inner=spriteBlock(list,x+50,y+58)+(isAsc?ASCTXT(x+93,y+17,'end'):'');
    const order=((SOUTH[i][0]+SOUTH[i][1]*4)%12)*0.07;
    s+='<g class="hg" style="animation-delay:'+order.toFixed(2)+'s"><rect class="hl'+(isAsc?' asc-cell':'')+'" x="'+x+'" y="'+y+'" width="100" height="100"/>'+
       '<text class="sg" x="'+(x+8)+'" y="'+(y+16)+'">'+(LANG==='hi'?HI_SIGN[i]:SIGNS[i][1].slice(0,3))+'</text>'+
       (isAsc?'<line x1="'+x+'" y1="'+(y+30)+'" x2="'+(x+30)+'" y2="'+y+'" stroke="#f2c66d" stroke-width="1.6"/>':'')+inner+'</g>';
  }
  const nm=chart?(chart.inp.name.length>16?chart.inp.name.slice(0,15)+'\u2026':chart.inp.name):'';
  s+='<g class="hg" style="animation-delay:.9s"><text class="ctr" x="200" y="192" text-anchor="middle">'+esc(nm)+'</text><text class="ctr2" x="200" y="216" text-anchor="middle">'+esc(t(v.mode==='D1'?'centre1':'centre9'))+'</text></g>';
  return s+'</svg>';

/* ================= REAL PDF REPORT ================= */
function pdfEscape(s){
  return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}

function makeRealPdf(text){
  const rawLines=String(text||'').replace(/\r/g,'').split('\n');
  const lines=[];
  const MAX=88;

  rawLines.forEach(function(line){
    line=line.replace(/\t/g,'    ');
    if(!line){ lines.push(''); return; }
    while(line.length>MAX){
      let cut=line.lastIndexOf(' ',MAX);
      if(cut<45) cut=MAX;
      lines.push(line.slice(0,cut));
      line=line.slice(cut).replace(/^\s+/,'');
    }
    lines.push(line);
  });

  const perPage=47;
  const pages=[];
  for(let i=0;i<lines.length;i+=perPage) pages.push(lines.slice(i,i+perPage));
  if(!pages.length) pages.push(['Kundali Report']);

  const objects=[];
  objects.push('<< /Type /Catalog /Pages 2 0 R >>');
  objects.push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(6+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  objects.push('<< /Producer (Kundali - The Path of Life) /Title (Kundali Personal Report) >>');

  pages.forEach(function(page,index){
    const commands=[];
    commands.push('q');
    commands.push('0.04 0.02 0.12 rg');
    commands.push('0 0 595 842 re f');
    commands.push('Q');

    let y=805;
    page.forEach(function(line){
      const isHeading=/^(KUNDALI|PERSONAL BIRTH|\d+\. |DISCLAIMER|PERSONALITY|INTERPRETATION|GUIDANCE)/i.test(line);
      const isSmall=/^={10,}$/.test(line);
      if(isHeading){
        commands.push('BT /F2 11 Tf 0.95 0.80 0.40 rg 50 '+y+' Td ('+pdfEscape(line.slice(0,100))+') Tj ET');
        y-=16;
      }else if(isSmall){
        commands.push('BT /F1 7 Tf 0.55 0.50 0.70 rg 50 '+y+' Td ('+pdfEscape(line.slice(0,100))+') Tj ET');
        y-=10;
      }else{
        /* Standard PDF Helvetica is used here so the file is a genuine,
           portable PDF. Non-Latin characters are replaced rather than
           producing a corrupt PDF. The report itself is English-first. */
        const safe=line.replace(/[^\x20-\x7E]/g,'?');
        commands.push('BT /F1 9.5 Tf 0.92 0.90 0.96 rg 50 '+y+' Td ('+pdfEscape(safe)+') Tj ET');
        y-=14;
      }
    });

    commands.push('BT /F1 8 Tf 0.55 0.50 0.70 rg 50 25 Td (Kundali - The Path of Life  |  Page '+(index+1)+' of '+pages.length+') Tj ET');

    const stream=commands.join('\n');
    const pageObj=6+index*2;
    const contentObj=pageObj+1;
    objects[pageObj-1]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+contentObj+' 0 R >>';
    objects[contentObj-1]='<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream';
  });

  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets=[0];
  objects.forEach(function(obj,i){
    offsets[i+1]=pdf.length;
    pdf+=(i+1)+' 0 obj\n'+obj+'\nendobj\n';
  });
  const xref=pdf.length;
  pdf+='xref\n0 '+(objects.length+1)+'\n';
  pdf+='0000000000 65535 f \n';
  for(let i=1;i<=objects.length;i++){
    pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  }
  pdf+='trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R /Info 5 0 R >>\n';
  pdf+='startxref\n'+xref+'\n%%EOF';
  return pdf;
}

    const c=r<.18?[255,228,175]:(r<.5?[216,164,255]:[130,160,255]);
    const a=(Math.random()*.55+.25)*(r<.18?1:.85);
    GAL.push({r:r,ang:ang,s:Math.random()*1.5+.5,col:'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(2)+')'});
  }
})();

const S={phase:'landing',castStart:0,tc:0,cap:false,tilt:.42,tiltT:.42,galA:1,galT:1,plA:1,plT:1,ringA:1,ringT:1,wheelA:0,wheelT:0,spin:0,mul:1,mulT:1,st:[],lvl:[]};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const base=()=>Math.min(W*.48,H*.5);
const msz=()=>Math.min(W,H);
function trN(){return clamp((S.tilt-.42)/.58,0,1);}
function proj(x,y){
  const rot=-.38*(1-trN()), yy=y*S.tilt, c=Math.cos(rot), s=Math.sin(rot);
  return [cx+x*c-yy*s, cy+x*s+yy*c];
}
function orbitPos(i){
  const d=P[i], R=base()*d.fr, om=.12/Math.pow(d.fr,1.5), a=PH[i]+S.spin*om;
  const xy=proj(R*Math.cos(a),R*Math.sin(a)), dep=1+.3*Math.sin(a)*(1-trN());
  return {x:xy[0],y:xy[1],s:Math.max(3,msz()*.014*d.f*dep)};
}
const OFF=[0,-1,1];
function wheelTarget(i){
  const Rp=msz()*.27, p=chart?chart:S.chart, lon=p.planets[i].lon, r=Rp*(1+.1*OFF[S.lvl[i]||0]);
  const th=Math.PI-rad(lon-p.asc);
  return {r:r,th:th,s:Math.max(3,msz()*.012*P[i].f)};
}
function planetState(i){
  if(S.phase==='landing'||!S.cap)return {o:orbitPos(i),p:0};
  const pr=S.phase==='result'?1:clamp((S.tc-.8-.14*i)/2.6,0,1), e=easeIO(pr), a=S.st[i], t=wheelTarget(i);
  const dth=((((t.th-a.th)%TAU)+TAU)%TAU)+TAU;
  const r=a.r+(t.r-a.r)*e, th=a.th+dth*e;
  return {o:{x:cx+r*Math.cos(th),y:cy+r*Math.sin(th),s:a.s+(t.s-a.s)*e},p:pr,th:th};
}
function capture(){
  S.st=P.map((_,i)=>{const o=orbitPos(i);return {r:Math.hypot(o.x-cx,o.y-cy),th:Math.atan2(o.y-cy,o.x-cx),s:o.s};});
  S.cap=true;
}

const CAST_END=6.2;
let castIdx=-1;
function castShow(idx,fade){
  const title=$('cast-title');
  const apply=()=>{title.textContent=t('cast'+idx+'a');$('cast-sub').textContent=t('cast'+idx+'b')+t('for',{n:S.chart?S.chart.inp.name:''});title.style.opacity=1;};
  if(fade){title.style.opacity=0;setTimeout(apply,idx?280:0);}else apply();
}
function castText(tc){
  const idx=tc<1.9?0:(tc<4.0?1:2);
  if(idx!==castIdx){castIdx=idx;castShow(idx,true);}
  const cur=tc<1.6?0:(tc<3.4?1:(tc<5.0?2:3));
  Array.prototype.forEach.call($('prog').children,(li,n)=>{li.classList.toggle('done',n<cur);li.classList.toggle('cur',n===cur);});
}
function startCast(ch){
  chart=ch; S.chart=ch; S.phase='cast'; S.castStart=performance.now()/1000; S.cap=false; S.tc=0; castIdx=-1;
  const placed=[]; S.lvl=[];
  ch.planets.forEach((p,i)=>{let c=0; placed.forEach(q=>{if(Math.abs(((p.lon-q.lon+540)%360)-180)<9)c++;}); S.lvl[i]=c%3; placed.push(p);});
  S.plT=1;S.plA=1;
  document.body.dataset.scene='cast'; window.scrollTo(0,0);
  Array.prototype.forEach.call($('prog').children,li=>{li.classList.remove('done','cur');});
}
function showResult(){
  S.phase='result'; S.plT=0; S.wheelT=0; S.galT=.5; S.tiltT=.42; S.ringT=.25; S.mulT=1;
  document.body.dataset.scene='result';
  $('landing').style.display='none';
  $('result').style.display='block';
  showPane('overview'); renderResult(); window.scrollTo(0,0);
}
function reset(){
  S.phase='landing'; S.cap=false; S.plA=0; S.plT=1; S.wheelT=0; S.galT=1; S.tiltT=.42; S.ringT=1; S.mulT=1;
  document.body.dataset.scene='landing';
  $('result').style.display='none'; $('landing').style.display='';
  window.scrollTo(0,0);
}
$('again').addEventListener('click',reset);
$('newk').addEventListener('click',reset);
$('brand').addEventListener('click',()=>{if(document.body.dataset.scene==='result')reset();else window.scrollTo(0,0);});


function update(dt,now){
  const k=1-Math.exp(-dt*2.2), ks=1-Math.exp(-dt*1.3);
  if(S.phase==='cast'){
    S.tc=now-S.castStart;
    S.mulT=S.tc<.8?5:1.5;
    if(S.tc>=.8&&!S.cap){capture();S.tiltT=1;S.galT=.3;S.ringT=0;}
    S.wheelT=S.tc>1.3?1:0;
    castText(S.tc);
    if(S.tc>=CAST_END)showResult();
  }
  S.mul+=(S.mulT-S.mul)*k; S.spin+=dt*S.mul;
  S.tilt+=(S.tiltT-S.tilt)*k; S.galA+=(S.galT-S.galA)*k; S.plA+=(S.plT-S.plA)*k;
  S.ringA+=(S.ringT-S.ringA)*k; S.wheelA+=(S.wheelT-S.wheelA)*ks;
}
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function drawPlanet(d,x,y,s){
  const im=PIMG[d.k]; if(im){const side=s*PIMG_K; ctx.drawImage(im,x-side/2,y-side/2,side,side); return;}
  glow(x,y,s*3.4,d.glow);
  const b=ctx.createRadialGradient(x-s*.35,y-s*.35,s*.1,x,y,s); b.addColorStop(0,d.hi); b.addColorStop(1,d.col);
  ctx.fillStyle=b; ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fill();
  if(d.ring){ctx.strokeStyle=d.hi;ctx.lineWidth=Math.max(1,s*.2);ctx.beginPath();ctx.ellipse(x,y,s*1.95,s*.55,-.35,0,TAU);ctx.stroke();}
}
function drawWheel(a,now){
  const Rp=msz()*.27, Ri=Rp*1.2, Ro=Rp*1.5, asc=S.chart.asc;
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=1.2; ctx.strokeStyle='rgba(242,198,109,.75)';
  ctx.beginPath(); ctx.arc(cx,cy,Ri,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(cx,cy,Ro,0,TAU); ctx.stroke();
  ctx.font=Math.round(Rp*.13)+'px "Segoe UI Symbol","Noto Sans Symbols",serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#f6dca0';
  for(let k=0;k<12;k++){
    const th=Math.PI-rad(30*k-asc), tm=Math.PI-rad(30*k+15-asc), c=Math.cos(th), s=Math.sin(th);
    ctx.strokeStyle='rgba(242,198,109,.6)'; ctx.beginPath(); ctx.moveTo(cx+Ri*c,cy+Ri*s); ctx.lineTo(cx+Ro*c,cy+Ro*s); ctx.stroke();
    ctx.strokeStyle='rgba(185,172,219,.10)'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Ri*c,cy+Ri*s); ctx.stroke();
    const rm=(Ri+Ro)/2; ctx.fillText(SIGNS[k][2],cx+rm*Math.cos(tm),cy+rm*Math.sin(tm));
  }
  ctx.strokeStyle='rgba(255,226,150,.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-Ro,cy); ctx.stroke();
  ctx.fillStyle='#ffe29a'; ctx.font='600 '+Math.max(11,Math.round(Rp*.1))+'px Inter,Noto Sans Devanagari,system-ui,sans-serif'; ctx.fillText(LANG==='hi'?'लग्न':'Lagna',cx-Ro*.62,cy-Rp*.1);
  ctx.restore();
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);
  bg.addColorStop(0,'#1c1044'); bg.addColorStop(.5,'#0b0720'); bg.addColorStop(1,'#04020c');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of STARS){ctx.globalAlpha=s.a*(.55+.45*Math.sin(now*s.f+s.p));ctx.fillRect(s.x*W,s.y*H,s.r,s.r);}
  /* galaxy */
  const Gm=base()*1.3;
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=S.galA;
  glow(cx,cy,Gm*.35,'rgba(255,214,150,.38)');
  for(const p of GAL){
    const a=p.ang+now*.09/(.25+p.r), R=p.r*Gm, xy=proj(R*Math.cos(a),R*Math.sin(a));
    ctx.fillStyle=p.col; ctx.fillRect(xy[0],xy[1],p.s,p.s);
  }
  ctx.globalCompositeOperation='source-over';
  /* orbit rings */
  if(S.ringA>.01){
    ctx.globalAlpha=1; ctx.lineWidth=1; ctx.strokeStyle='rgba(242,198,109,'+(.17*S.ringA).toFixed(3)+')';
    const rot=-.38*(1-trN());
    [.30,.40,.50,.60,.70,.80,.90,1.0].forEach(f=>{ctx.beginPath();ctx.ellipse(cx,cy,base()*f,base()*f*S.tilt,rot,0,TAU);ctx.stroke();});
  }
  /* wheel */
  if(S.wheelA>.01&&S.chart)drawWheel(S.wheelA,now);
  /* planets */
  if(S.plA>.01){
    const list=P.map((d,i)=>({d:d,i:i,st:planetState(i)})).sort((a,b)=>a.st.o.y-b.st.o.y);
    for(const it of list){
      ctx.globalAlpha=S.plA; drawPlanet(it.d,it.st.o.x,it.st.o.y,it.st.o.s);
      if(it.st.p>.85){
        const la=clamp((it.st.p-.85)/.15,0,1)*S.plA, th=it.st.th!==undefined?it.st.th:0, dd=it.st.o.s+Math.max(10,msz()*.03);
        ctx.globalAlpha=la; ctx.fillStyle='#fff3d6'; ctx.font='600 '+Math.max(10,Math.round(msz()*.026))+'px Inter,Noto Sans Devanagari,system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(plAb(it.d.k),it.st.o.x-dd*Math.cos(th),it.st.o.y-dd*Math.sin(th));
      }
    }
  }
  ctx.globalAlpha=1;
}
let last=performance.now()/1000;
function frame(ts){
  const now=ts/1000, dt=Math.min(.05,Math.max(0,now-last)); last=now;
  update(dt,now); draw(now); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

buildPlanetImages(); renderPops(); applyLang(); renderRecent(); setStatus('');
})();
</script>
</body>
